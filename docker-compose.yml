# 예약 REST API만 기동 (관리자 UI·별도 DB 서버 없음).
# 로컬 Docker: MCP(stdio)는 RESERVATION_API_BASE_URL=http://127.0.0.1:6015/api/v1
# 운영: https://reservation.dmu.gosky.kr/api/v1
services:
  reservation-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # 예약 API는 같은 서버의 AI·FE 서버가 127.0.0.1로만 부른다(외부 직접 접근 차단)
      - "127.0.0.1:6015:6015"
    environment:
      PORT: "6015"
      DATABASE_URL: file:/app/data/dev.db
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 필수}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_PANEL_PASSWORD: ${ADMIN_PANEL_PASSWORD:?ADMIN_PANEL_PASSWORD 필수}
    volumes:
      - reservation_sqlite:/app/data
    restart: unless-stopped
    # FE 컨테이너가 http://reservation-api:6015 로 붙는 내부 네트워크. 호스트에서 한 번 만든다: docker network create sb-internal
    networks:
      default:
      sb-internal:
        aliases:
          - reservation-api

networks:
  sb-internal:
    external: true
    name: sb-internal

volumes:
  reservation_sqlite:
